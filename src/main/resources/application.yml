spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: ORMAN-BACKEND
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${ORMAN_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${ORMAN_MULTIPART_MAX_REQUEST_SIZE:21MB}
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'America/La_Paz'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:orman-backend}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cookie:
    refresh-name: ${REFRESH_COOKIE_NAME:orman_refresh}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

storage:
  personas:
    root: ${PERSONA_PHOTO_STORAGE_ROOT:./storage}
    max-file-size-bytes: ${PERSONA_PHOTO_MAX_FILE_SIZE_BYTES:2097152}
    max-dimension: ${PERSONA_PHOTO_MAX_DIMENSION:320}
  propiedades:
    root: ${PROPERTY_PHOTO_STORAGE_ROOT:./storage}
    max-file-size-bytes: ${PROPERTY_PHOTO_MAX_FILE_SIZE_BYTES:5242880}
    max-dimension: ${PROPERTY_PHOTO_MAX_DIMENSION:1600}
  unidades:
    root: ${UNIT_PHOTO_STORAGE_ROOT:./storage}
    max-file-size-bytes: ${UNIT_PHOTO_MAX_FILE_SIZE_BYTES:5242880}
    max-dimension: ${UNIT_PHOTO_MAX_DIMENSION:1600}
  contratos:
    root: ${CONTRACT_DOCUMENT_STORAGE_ROOT:./storage}
    max-file-size-bytes: ${CONTRACT_DOCUMENT_MAX_FILE_SIZE_BYTES:20971520}
    target-optimized-size-bytes: ${CONTRACT_DOCUMENT_TARGET_SIZE_BYTES:10485760}
    max-image-pixels-to-optimize: ${CONTRACT_DOCUMENT_MAX_IMAGE_PIXELS:16000000}
  pagos:
    root: ${PAYMENT_IMAGE_STORAGE_ROOT:./storage}
    max-file-size-bytes: ${PAYMENT_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
    max-dimension: ${PAYMENT_IMAGE_MAX_DIMENSION:1920}

notification:
  scheduler:
    cron: ${NOTIFICATION_SCHEDULER_CRON:0 0 8 * * *}

orman:
  storage:
    r2:
      endpoint: ${ORMAN_R2_ENDPOINT:}
      bucket: ${ORMAN_R2_BUCKET:}
      access-key-id: ${ORMAN_R2_ACCESS_KEY_ID:}
      secret-access-key: ${ORMAN_R2_SECRET_ACCESS_KEY:}
  firebase:
    enabled: ${ORMAN_FIREBASE_ENABLED:false}
    project-id: ${ORMAN_FIREBASE_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
    service-account-json: ${ORMAN_FIREBASE_SERVICE_ACCOUNT_JSON:}

contract:
  scheduler:
    cron: ${CONTRACT_SCHEDULER_CRON:0 5 0 * * *}
