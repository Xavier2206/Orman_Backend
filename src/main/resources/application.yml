spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:./.env[.properties]
  application:
    name: ORMAN-BACKEND
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orman}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: 9090

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:orman-backend}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cookie:
    refresh-name: ${REFRESH_COOKIE_NAME:orman_refresh}
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins:
      - ${ORMAN_FRONTEND_URL:http://localhost:4200}
