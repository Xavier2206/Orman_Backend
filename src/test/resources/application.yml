spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: ORMAN-BACKEND
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orman}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: 9090

security:
  jwt:
    secret: test-only-secret-with-at-least-32-bytes-0001
    issuer: orman-backend-test
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  cookie:
    refresh-name: orman_refresh
    secure: false
    same-site: Lax
  cors:
    allowed-origins:
      - http://localhost:4200
