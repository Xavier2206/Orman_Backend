spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: ORMAN-BACKEND
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orman}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  mail:
    host: smtp.example.test
    port: 587
    username: test-user
    password: test-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 9090

security:
  mail:
    from: no-reply@example.test
  jwt:
    secret: test-only-secret-with-at-least-32-bytes-0001
    issuer: orman-backend-test
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  cookie:
    refresh-name: orman_refresh
    secure: false
    same-site: Lax
  cors:
    allowed-origins:
      - http://localhost:4200
  otp:
    hmac-secret: test-only-otp-hmac-secret-at-least-32-bytes
    expiration-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-resends: 3
storage:
  personas:
    root: ./target/test-storage
    max-file-size-bytes: 2097152
    max-dimension: 320

notification:
  scheduler:
    cron: "0 0 8 * * *"
    zone: America/La_Paz
