spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orman}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:9090}

security:
  cookie:
    secure: ${REFRESH_COOKIE_SECURE:false}
  cors:
    allowed-origins:
      - ${ORMAN_FRONTEND_URL:http://localhost:4200}

orman:
  storage:
    provider: ${ORMAN_STORAGE_PROVIDER:local}
